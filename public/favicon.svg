<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="favShieldBg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0a0c16" />
    </linearGradient>
    <linearGradient id="favBorderGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="favTopWing" x1="10" y1="10" x2="34" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="favBottomWing" x1="10" y1="24" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="favBridge" x1="14" y1="30" x2="30" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Squircle -->
  <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#favShieldBg)" stroke="url(#favBorderGrad)" stroke-width="1.8" />
  
  <!-- Subtle Internal Glow Grid -->
  <circle cx="22" cy="22" r="14" stroke="url(#favBorderGrad)" stroke-width="1.2" stroke-dasharray="2 3.5" opacity="0.45" />

  <!-- Top Wing (Sender Trajectory) -->
  <path d="M 12 11.5 H 31.5 C 32.8 11.5 33.6 12.8 33 13.9 L 27.2 21.5 H 18.5 L 24 15.5 H 12 Z" fill="url(#favTopWing)" filter="url(#favGlow)" />

  <!-- Diagonal Quantum Data Bridge -->
  <path d="M 28 17 L 16 27" stroke="url(#favBridge)" stroke-width="3.2" stroke-linecap="round" filter="url(#favGlow)" />

  <!-- Bottom Wing (Receiver Trajectory) -->
  <path d="M 32 32.5 H 12.5 C 11.2 32.5 10.4 31.2 11 30.1 L 16.8 22.5 H 25.5 L 20 28.5 H 32 Z" fill="url(#favBottomWing)" filter="url(#favGlow)" />

  <!-- Central Supercharged Photon Diamond Core -->
  <polygon points="22,18 25.5,22 22,26 18.5,22" fill="#FFFFFF" filter="url(#favGlow)" />
  <circle cx="22" cy="22" r="1.5" fill="#00F0FF" />
</svg>
